services:
  postgres:
    image: postgres:16
    container_name: shopstream-postgres-compose
    environment:
      POSTGRES_USER: shopstream
      POSTGRES_PASSWORD: shopstream123
      POSTGRES_DB: shopstream
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:latest
    container_name: shopstream-kafka-compose
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  inventory-service:
    build: ./inventory-service
    container_name: shopstream-inventory-compose
    ports:
      - "50051:50051"

  order-service:
    build: ./order-service
    container_name: shopstream-order-compose
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:9092
      INVENTORY_GRPC_URL: inventory-service:50051
    depends_on:
      - postgres
      - kafka
      - inventory-service

  graphql-api:
    build: ./graphql-api
    container_name: shopstream-graphql-compose
    ports:
      - "4000:4000"
    environment:
      ORDER_SERVICE_URL: http://order-service:3001
    depends_on:
      - order-service

  notification-service:
    build: ./notification-service
    container_name: shopstream-notification-compose
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  dashboard:
    build: ./dashboard
    container_name: shopstream-dashboard-compose
    ports:
      - "5173:5173"
    depends_on:
      - graphql-api